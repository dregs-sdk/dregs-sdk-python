# Lint, type-check, and test. uv owns both the interpreter and the locked dependency set, so
# these are the same commands a contributor runs locally and they resolve to the same versions.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails the build if uv.lock is out of step with pyproject.toml, rather than
      # quietly resolving something different from what was committed.
      - name: Sync
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  test:
    name: Test on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest

  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: uv build

      # Catches a README that renders on GitHub but would be rejected by PyPI, which is only
      # otherwise discovered at publish time.
      - name: Check the metadata
        run: uvx twine check dist/*

      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
