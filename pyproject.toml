[project]
name = "dregs"
version = "0.1.0"
description = "Python SDK for Dregs, the fraud and abuse scoring service."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dregs", email = "support@dregs.com" }]
keywords = ["dregs", "fraud", "abuse", "fraud-detection", "bot-detection", "risk-scoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://dregs.com"
Documentation = "https://dregs.com/manual/api/"
Source = "https://github.com/dregs-sdk/dregs-sdk-python"
Issues = "https://github.com/dregs-sdk/dregs-sdk-python/issues"
Changelog = "https://github.com/dregs-sdk/dregs-sdk-python/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dregs"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "RUF",    # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins and use assert-heavy style.
"tests/*" = ["A002", "A003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "respx.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
